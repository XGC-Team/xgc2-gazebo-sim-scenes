name: Scene timing and collision regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scene-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate dynamic person collision assets and plugin wiring
        run: python3 -m unittest discover -s gazebo_sim_worlds/test -p test_dynamic_person_collision.py -v
      - name: Compile and run path timing regression
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Ixgc2_gazebo_scene/include xgc2_gazebo_scene/test/path_timing_test.cpp -o /tmp/path_timing_test
          timeout 30s /tmp/path_timing_test
          g++ -std=c++11 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ixgc2_gazebo_scene/include xgc2_gazebo_scene/test/path_timing_test.cpp -o /tmp/path_timing_san
          timeout 30s /tmp/path_timing_san
