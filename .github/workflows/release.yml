name: release
on:
  workflow_dispatch:
    inputs:
      expected_version:
        required: true
        type: string
      expected_source_sha:
        required: true
        type: string
      prepare_action:
        required: false
        default: release
        type: choice
        options: [release, compatibility-verify]
      apt_overlay_url:
        required: false
        default: ""
        type: string
      dependency_set_digest:
        required: false
        default: ""
        type: string
permissions:
  actions: read
  contents: read
  packages: read
defaults:
  run:
    shell: bash
env:
  DOCKER_IMAGE: ${{ vars.XGC2_CLASSIC_BUILD_IMAGE }}
  XGC2_PYTHON_EXECUTABLE: ${{ vars.XGC2_CLASSIC_PYTHON_EXECUTABLE }}
  XGC2_XRPC_WHEEL_URL: ${{ vars.XGC2_XRPC_WHEEL_URL }}
  XGC2_XRPC_WHEEL_SHA256: ${{ vars.XGC2_XRPC_WHEEL_SHA256 }}
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
  EXPECTED_VERSION: ${{ inputs.expected_version }}
  EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
  PREPARE_ACTION: ${{ inputs.prepare_action }}
jobs:
  build-debs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate central prepare identity
        run: |
          test "$EXPECTED_VERSION" = "$(awk '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          test "$EXPECTED_SOURCE_SHA" = "$(git rev-parse HEAD)"
          case "$PREPARE_ACTION" in release|compatibility-verify) ;; *) exit 1 ;; esac
          if [[ -n "$XGC2_APT_OVERLAY_URL" ]]; then
            [[ "$XGC2_DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          fi
      - name: Check source metadata
        run: |
          git diff --check HEAD
          bash -n .xgc2/scripts/*.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and install-check Classic native packages
        run: |
          install -d "$GITHUB_WORKSPACE/.ci/build-manifests"
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/xgc2-scenes-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"
      - name: Create trusted v1 build manifest
        run: |
          version="$(awk '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          test -n "$version"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs --output-dir .ci/build-manifests \
            --product xgc2-gazebo-sim-scenes --product-version "$version" \
            --distribution focal --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
      - name: Upload exact Debian packages and manifests
        if: ${{ inputs.prepare_action == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-gazebo-sim-scenes-release-debs-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
