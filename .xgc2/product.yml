schema: xgc2.product.v1
id: xgc2-gazebo-sim-scenes
name: XGC2 Gazebo Sim Scenes
version: 1.4.1-8
kind: ros1-apt
summary: Explicit Gazebo Classic worlds, native simulation-v1 service, ROS user data, simple lidar and rendering.
ros:
  distro: noetic
  packages:
  - gazebo_sim_worlds
  - xgc2_gazebo_scene
  - xgc2_simple_lidar
  - xgc2_gazebo_rendering
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-gazebo-sim-worlds
  - ros-noetic-xgc2-gazebo-scene
  - ros-noetic-xgc2-simple-lidar
  - ros-noetic-xgc2-gazebo-rendering
  packages:
  - ros-noetic-xgc2-gazebo-sim-worlds
  - ros-noetic-xgc2-gazebo-scene
  - ros-noetic-xgc2-simple-lidar
  - ros-noetic-xgc2-gazebo-rendering
  depends:
  - python3
  - ros-noetic-roslaunch
  - libgazebo11
  - ros-noetic-gazebo-msgs
  - ros-noetic-gazebo-ros
  - ros-noetic-geometry-msgs
  - ros-noetic-message-runtime
  - ros-noetic-rosconsole
  - ros-noetic-roscpp
  - ros-noetic-roscpp-serialization
  - ros-noetic-rospy
  - ros-noetic-rostime
  - ros-noetic-rosgraph-msgs
  - libxgc2-xrpc1 (>= 0.1.0-1~focal)
  - ros-noetic-xgc2-scene-runtime (>= 1.2.0-13)
  - ros-noetic-sensor-msgs
  - ros-noetic-std-msgs
  - ros-noetic-xacro
  - ros-noetic-xgc2-geometry-msgs (>= 1.2.0-1)
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-gazebo-sim-worlds ros-noetic-xgc2-gazebo-scene ros-noetic-xgc2-simple-lidar ros-noetic-xgc2-gazebo-rendering

    '
  smoke_test: 'rospack find gazebo_sim_worlds

    rospack find xgc2_gazebo_scene

    rospack find xgc2_simple_lidar

    test -f /opt/ros/noetic/share/gazebo_sim_worlds/worlds/empty/empty.world

    test -f /opt/ros/noetic/share/gazebo_sim_worlds/models/corridor/model.sdf

    test -f /opt/ros/noetic/share/gazebo_sim_worlds/worlds/catalog/uav6_knot_obstacles.world

    test -f /opt/ros/noetic/share/gazebo_sim_worlds/worlds/catalog/ugv4_figure_eight_obstacles.world

    test -f /opt/ros/noetic/lib/libobstaclePathPlugin.so

    test -f /opt/ros/noetic/lib/libxgc2_gazebo_scene_geometry.so

    test -f /opt/ros/noetic/lib/libxgc2_gazebo_scene_system.so

    test -f /opt/ros/noetic/lib/libxgc2_simulation_service.so

    test -f /opt/ros/noetic/lib/libxgc2_simulation_world.so

    test -f /opt/ros/noetic/lib/libxgc2_simulation_entity_ack.so

    test -f /opt/ros/noetic/lib/libxgc2_simulation_sensor_ack.so

    test -f /opt/ros/noetic/lib/libxgc2_simulation_ros_data.so

    test -x /opt/ros/noetic/lib/gazebo_sim_worlds/native_world_start

    test -x /opt/ros/noetic/lib/xgc2_gazebo_scene/simulation_world_prepare

    test -x /opt/ros/noetic/lib/xgc2_gazebo_scene/spawn_robot_model

    test -f /opt/ros/noetic/share/xgc2_simple_lidar/package.xml

    test -f /opt/ros/noetic/share/xgc2_simple_lidar/models/sensor.xacro

    test -f /opt/ros/noetic/share/xgc2_simple_lidar/models/sensor.sdf.xacro

    test -f /opt/ros/noetic/share/xgc2_simple_lidar/cmake/xgc2_simple_lidarConfig.cmake

    test -f /opt/ros/noetic/include/xgc2_simple_lidar/scan_projection.hpp

    test -f /opt/ros/noetic/lib/libxgc2_simple_lidar.so

    test -f /opt/ros/noetic/lib/libxgc2_simple_lidar_cpu.so

    test -f /opt/ros/noetic/lib/libxgc2_gazebo_rendering.so

    test -f /opt/ros/noetic/lib/pkgconfig/xgc2_simple_lidar.pc

    test -f /opt/ros/noetic/share/gazebo_sim_worlds/worlds/catalog/scene_editable.world

    '
  notes: 'This product keeps reusable world assets, the scene director, the

    independent xgc2_simple_lidar sensor plugin, and the Gazebo shadow-depth

    plugin in separate ROS packages. gazebo_sim_worlds owns world and model

    assets only; xgc2_gazebo_scene owns scene control and truth projection;

    xgc2_simple_lidar owns its CPU/GPU ray plugin and reusable sensor xacro;

    xgc2_gazebo_rendering owns libxgc2_gazebo_rendering.so. World assets do not

    depend on the lidar.

    '
ownership:
  paths:
  - /opt/ros/noetic/share/gazebo_sim_worlds
  - /opt/ros/noetic/share/xgc2_gazebo_scene
  - /opt/ros/noetic/share/xgc2_simple_lidar
  - /opt/ros/noetic/include/xgc2_gazebo_scene
  - /opt/ros/noetic/include/xgc2_simple_lidar
  - /opt/ros/noetic/lib/libobstaclePathPlugin.so
  - /opt/ros/noetic/lib/libxgc2_gazebo_scene_geometry.so
  - /opt/ros/noetic/lib/libxgc2_gazebo_scene_motion.so
  - /opt/ros/noetic/lib/libxgc2_gazebo_scene_system.so
  - /opt/ros/noetic/lib/libxgc2_scene_model.so
  - /opt/ros/noetic/lib/libxgc2_gazebo_rendering.so
  - /opt/ros/noetic/share/xgc2_gazebo_rendering
  - /opt/ros/noetic/lib/libxgc2_simulation_service.so
  - /opt/ros/noetic/lib/libxgc2_simulation_world.so
  - /opt/ros/noetic/lib/libxgc2_simulation_entity_ack.so
  - /opt/ros/noetic/lib/libxgc2_simulation_sensor_ack.so
  - /opt/ros/noetic/lib/libxgc2_simulation_ros_data.so
  - /opt/ros/noetic/lib/gazebo_sim_worlds
  - /opt/ros/noetic/lib/libxgc2_simple_lidar.so
  - /opt/ros/noetic/lib/libxgc2_simple_lidar_cpu.so
  - /opt/ros/noetic/lib/xgc2_simple_lidar
  - /opt/ros/noetic/lib/python3/dist-packages/xgc2_simple_lidar
  - /opt/ros/noetic/lib/pkgconfig/xgc2_gazebo_scene.pc
  - /opt/ros/noetic/lib/pkgconfig/xgc2_simple_lidar.pc
  - /opt/ros/noetic/lib/python3/dist-packages/xgc2_gazebo_scene
  - /opt/ros/noetic/lib/xgc2_gazebo_scene
  - /opt/ros/noetic/share/common-lisp/ros/xgc2_gazebo_scene
  - /opt/ros/noetic/share/gennodejs/ros/xgc2_gazebo_scene
  - /opt/ros/noetic/share/roseus/ros/xgc2_gazebo_scene
release:
  requires:
  - libxgc2-robotics-interfaces-dev
  dependency_policy:
    xgc2-scene-generation: rebuild
    xgc2-xrpc: rebuild
    libxgc2-robotics-interfaces-dev: rebuild
  apt_versions:
    focal: 1.4.1-8
