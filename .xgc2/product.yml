schema: xgc2.product.v1
id: xgc2-gazebo-sim-scenes
name: XGC2 Gazebo Sim Scenes
version: 1.4.0-1
kind: ros1-apt
summary: Reusable Gazebo Classic worlds, scene director, and simple lidar plugin.
ros:
  distro: noetic
  packages:
  - gazebo_sim_worlds
  - xgc2_gazebo_scene
  - xgc2_simple_lidar
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-gazebo-sim-worlds
  - ros-noetic-xgc2-gazebo-scene
  - ros-noetic-xgc2-simple-lidar
  packages:
  - ros-noetic-xgc2-gazebo-sim-worlds
  - ros-noetic-xgc2-gazebo-scene
  - ros-noetic-xgc2-simple-lidar
  depends:
  - libgazebo11
  - ros-noetic-gazebo-ros
  - ros-noetic-geometry-msgs
  - ros-noetic-message-runtime
  - ros-noetic-rosconsole
  - ros-noetic-roscpp
  - ros-noetic-roscpp-serialization
  - ros-noetic-rostime
  - ros-noetic-sensor-msgs
  - ros-noetic-std-msgs
  - ros-noetic-xacro
  - ros-noetic-xgc2-geometry-msgs (>= 1.2.0-1)
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-gazebo-sim-worlds ros-noetic-xgc2-gazebo-scene ros-noetic-xgc2-simple-lidar

    '
  smoke_test: 'rospack find gazebo_sim_worlds

    rospack find xgc2_gazebo_scene

    rospack find xgc2_simple_lidar

    test -f /opt/ros/noetic/share/gazebo_sim_worlds/worlds/empty/empty.world

    test -f /opt/ros/noetic/share/gazebo_sim_worlds/models/corridor/model.sdf

    test -f /opt/ros/noetic/share/gazebo_sim_worlds/worlds/catalog/uav6_knot_obstacles.world

    test -f /opt/ros/noetic/share/gazebo_sim_worlds/worlds/catalog/ugv4_figure_eight_obstacles.world

    test -f /opt/ros/noetic/lib/libobstaclePathPlugin.so

    test -f /opt/ros/noetic/lib/libxgc2_gazebo_scene_geometry.so

    test -f /opt/ros/noetic/lib/libxgc2_gazebo_scene_system.so

    test -f /opt/ros/noetic/lib/libxgc2_scene_authoring_world.so

    test -f /opt/ros/noetic/share/xgc2_simple_lidar/package.xml

    test -f /opt/ros/noetic/share/xgc2_simple_lidar/models/sensor.xacro

    test -f /opt/ros/noetic/share/xgc2_simple_lidar/models/sensor.sdf.xacro

    test -f /opt/ros/noetic/share/xgc2_simple_lidar/cmake/xgc2_simple_lidarConfig.cmake

    test -f /opt/ros/noetic/include/xgc2_simple_lidar/scan_projection.hpp

    test -f /opt/ros/noetic/lib/libxgc2_simple_lidar.so

    test -f /opt/ros/noetic/lib/pkgconfig/xgc2_simple_lidar.pc

    test -f /opt/ros/noetic/share/gazebo_sim_worlds/worlds/catalog/scene_editable.world

    '
  notes: 'This product keeps reusable world assets, the scene director, and the

    independent xgc2_simple_lidar sensor plugin in separate ROS packages.

    gazebo_sim_worlds owns world and model assets only; xgc2_gazebo_scene owns

    scene control and truth projection; xgc2_simple_lidar owns its GPU ray

    plugin and reusable sensor xacro. World assets do not depend on the lidar.

    '
ownership:
  paths:
  - /opt/ros/noetic/share/gazebo_sim_worlds
  - /opt/ros/noetic/share/xgc2_gazebo_scene
  - /opt/ros/noetic/share/xgc2_simple_lidar
  - /opt/ros/noetic/include/xgc2_gazebo_scene
  - /opt/ros/noetic/include/xgc2_simple_lidar
  - /opt/ros/noetic/lib/libobstaclePathPlugin.so
  - /opt/ros/noetic/lib/libxgc2_gazebo_scene_geometry.so
  - /opt/ros/noetic/lib/libxgc2_gazebo_scene_motion.so
  - /opt/ros/noetic/lib/libxgc2_gazebo_scene_system.so
  - /opt/ros/noetic/lib/libxgc2_scene_model.so
  - /opt/ros/noetic/lib/libxgc2_scene_authoring_world.so
  - /opt/ros/noetic/lib/libxgc2_simple_lidar.so
  - /opt/ros/noetic/lib/pkgconfig/xgc2_gazebo_scene.pc
  - /opt/ros/noetic/lib/pkgconfig/xgc2_simple_lidar.pc
  - /opt/ros/noetic/lib/python3/dist-packages/xgc2_gazebo_scene
  - /opt/ros/noetic/share/common-lisp/ros/xgc2_gazebo_scene
  - /opt/ros/noetic/share/gennodejs/ros/xgc2_gazebo_scene
  - /opt/ros/noetic/share/roseus/ros/xgc2_gazebo_scene
release:
  dependency_policy:
    xgc2-scene-generation: rebuild
  apt_versions:
    focal: 1.4.0-1
